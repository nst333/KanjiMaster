<!doctype html><html lang="ko"><meta charset="utf-8"><title>Responsive layout validation</title><body><label for="width">검증할 CSS viewport 너비</label><select id="width"><option>1440</option><option>1024</option><option>768</option><option>390</option></select><p>이 harness는 iframe의 실제 CSS viewport를 변경합니다. 실제 모바일 장치·touch·DPR 검증과는 별개입니다.</p><iframe id="app" title="검증 대상 앱" src="./" style="width:1440px;height:1000px;border:1px solid black"></iframe><script>document.getElementById('width').onchange=event=>document.getElementById('app').style.width=event.target.value+'px';</script></body></html>
